name: SUT Lost and Found CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  # -------------------------------------------------------------
  # Job 1: ตรวจสอบ Mobile App (React Native / Expo SDK 54)
  # -------------------------------------------------------------
  mobile-check:
    name: Mobile App (React Native / Expo) Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'lost-and-found/package.json'

      - name: 📦 Install Mobile Dependencies
        run: |
          cd lost-and-found
          npm install

      - name: 🔍 Typecheck Mobile TypeScript
        run: |
          cd lost-and-found
          npx tsc --noEmit

  # -------------------------------------------------------------
  # Job 2: ตรวจสอบ Web & Backend API (Next.js 15)
  # -------------------------------------------------------------
  web-api-check:
    name: Web & Backend API (Next.js) Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'lost-and-found-web/package.json'

      - name: 📦 Install Web Dependencies
        run: |
          cd lost-and-found-web
          npm install

      - name: 🔍 Typecheck Web TypeScript
        run: |
          cd lost-and-found-web
          npx tsc --noEmit

      - name: 🏗️ Build Next.js Production Bundle
        run: |
          cd lost-and-found-web
          npm run build

  # -------------------------------------------------------------
  # Job 3: Automated Unit & Integration Tests (20 Test Cases)
  # -------------------------------------------------------------
  automated-tests:
    name: Automated Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Workspace Dependencies
        run: npm install

      - name: 🧪 Run Auto-Matching & Database Persistence Tests
        run: npm test
